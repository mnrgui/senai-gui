<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubank</title>
    
    <style>

        body{
            font-family: serif, Helvetica, sans-serif;
            background-color: #c888f3;
            text-align: center;
        }

        #container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        #imagem-fundo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #login {
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translate(-50%, -50%);
            z-index: 1;
            background-color: white;
            width: 350px;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0px 4px 15px rgb(126, 2, 175);
            text-align: left;

            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #home {
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translate(-50%, -50%);
            z-index: 1;
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0px 4px 15px rgb(126, 2, 175);
            text-align: left;
            width: 350px;

            opacity: 0;
            display: none;
            transition: opacity 0.5s ease;
        }

    </style>

</head>

<body>

<div id="container">

    <img id="imagem-fundo" src="https://www.datocms-assets.com/120597/1780320379-homesite_desktop_1920x1281.png?auto=format&crop=focalpoint&dpr=1&fit=crop&w=2000&q=60" alt="Jovem rapaz equilibra o cartão do Nubank na cabeça">

    <section id="login">
        <div><h1>Abra sua conta Nubank</h1></div><br> 
        <input type="text" id="cpf" placeholder="Digite seu CPF"><br><br>
        <input type="button" value="Entrar" onclick="login()"><br><br>
    </section>

    <section id="home">

        <div style="width: 50%; background-color: #e0e0e0; display: flex; align-items: center; justify-content: center;">
            <img src="https://www.datocms-assets.com/120597/1734023889-app-nubank-pj-cartao-core-forms-2.png?auto=format&crop=focalpoint&dpr=1&fit=crop&quality=60" style="width: 80%;">
        </div>

        <div style="width: 50%; padding: 60px 40px; background-color: #f5f0eb; text-align: left;">
            <input type="text" id="usuario" placeholder="Nome Completo"><br><br>
            <input type="text" id="celular" placeholder="Celular"><br><br>
            <input type="text" id="email" placeholder="Digite seu email"><br><br>
            <input type="text" id="email2" placeholder="Confirmação do email"><br><br>
            <input type="button" value="Cadastrar" onclick="logout()"><br><br>
         </div>
    </section>

</div>

<script>

    function login(){
        let cpf = document.getElementById("cpf").value;

        if(cpf === "18896916747"){
            esconderLogin();
        }
    }

    function esconderLogin(){
        let telaLogin = document.getElementById("login");

        telaLogin.style.opacity = "0";
        setTimeout(function(){
            telaLogin.style.display = "none";
            mostrarHome();
        }, 500);
    }

    function mostrarHome(){
        let telaHome = document.getElementById("home");

        telaHome.style.display = "block";
        setTimeout(function(){
            telaHome.style.opacity = "1";
        }, 20);
    }

    function logout(){
        let telaHome = document.getElementById("home");
        telaHome.style.opacity = "0";

        setTimeout(function(){
            telaHome.style.display = "none";
            let telaLogin = document.getElementById("login");
            telaLogin.style.display = "block";
            setTimeout(function(){
                telaLogin.style.opacity = "1";
            }, 20);
        }, 500);
    }

</script>

</body>
</html>
