<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocalização</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #FF2900, #6610f2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
        }

        .resultado {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Geolocalizador 🌏</h2>

        <div class="input-group mb-3">
            <input type="text" id="cep" class="form-control" placeholder="Digite o CEP">
            <button class="btn btn-primary" onclick="buscarCEP()">
                Buscar
            </button>
        </div>

        <div id="resultado" class="resultado">
            <ul class="list-group">
                <li class="list-group-item">
                    <strong>Rua:</strong> <span id="rua"></span>
                </li>
                <li class="list-group-item">
                    <strong>Bairro:</strong> <span id="bairro"></span>
                </li>
                <li class="list-group-item">
                    <strong>Cidade:</strong> <span id="cidade"></span>
                </li>
                <li class="list-group-item">
                    <strong>Estado:</strong> <span id="estado"></span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        async function buscarCEP() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');

            if (cep.length !== 8) {
                alert('Digite um CEP válido!');
                return;
            }

            try {
                const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const dados = await resposta.json();

                if (dados.erro) {
                    alert('CEP não encontrado!');
                    return;
                }

                document.getElementById('rua').innerText = dados.logradouro;
                document.getElementById('bairro').innerText = dados.bairro;
                document.getElementById('cidade').innerText = dados.localidade;
                document.getElementById('estado').innerText = dados.uf;

                document.getElementById('resultado').style.display = 'block';

            } catch (erro) {
                alert('Erro ao buscar CEP!');
                console.error(erro);
            }
        }
    </script>

</body>
</html>
